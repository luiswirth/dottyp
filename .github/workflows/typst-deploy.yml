name: Deploy Typst Document

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: luiswirth/typst-deploy/.github/workflows/typst-deploy.yml@v2
    with:
      documents: |
        test/showcase.typ
        test/layout.typ
        test/notes.typ
      package_path: pkg
