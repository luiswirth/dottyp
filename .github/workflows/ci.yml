name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# A new push to a branch supersedes the run already in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The flake owns what is checked, so this file never learns a language. What
# runs here is what `nix run .#ci` runs on your machine.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      # The store closure comes from the GitHub Actions cache. FlakeHub is a
      # paid service and is off, which it otherwise reports as a failed login.
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-gha-cache: enabled
          use-flakehub: disabled
      - run: nix flake check
      - run: nix run .#ci
